name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (incluye la verificación de tipos con TypeScript)
        run: npm run build
